name: Tests

# 被 PR 流水线与发布流水线共用的测试集合。
# 只读代码、不使用任何密钥，因此 fork 的 PR 也可以安全执行。

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Node 单测
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm test
        run: npm test
      - name: 发布流水线自测
        run: node --test tests/packaging.test.mjs

  browser:
    name: 隔离浏览器测试
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装 Playwright（Edge 使用镜像自带的浏览器）
        run: npm install --no-save --no-package-lock playwright@1.63.0
      - name: 确认 Edge 可用
        run: |
          edge=""
          for candidate in \
            "/c/Program Files (x86)/Microsoft/Edge/Application/msedge.exe" \
            "/c/Program Files/Microsoft/Edge/Application/msedge.exe"; do
            if [ -f "$candidate" ]; then edge="$candidate"; fi
          done
          if [ -z "$edge" ]; then
            echo "::error::运行器上没有找到 Edge，无法执行浏览器测试"
            exit 1
          fi
          echo "Edge: $edge"
      - name: npm run test:browser
        run: npm run test:browser

  # 原「原地更新保持数据」job（tests/update-reload.cjs）已随未发布的本地自动更新
  # 机制（update-unpacked.ps1 覆盖、update-marker.json 标记、轮询与强制重载）一并退役：
  # 该机制从未发布、脚本与标记文件也不在仓库中，保留这条执行路径只会误导。
  # 若将来重新设计更新机制，应新增独立 job 并重新走审查，而不是恢复这里的跳过逻辑。
  packaging-windows:
    name: 打包专项（含 PowerShell 5.1 中文解压验证）
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 确认 Windows PowerShell 为 5.1
        run: powershell.exe -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - name: node --test tests/packaging.test.mjs
        run: node --test tests/packaging.test.mjs

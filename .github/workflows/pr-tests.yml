name: PR tests

# PR 只跑测试，不发布。
# 这里不配置任何密钥、也不需要 contents: write；fork 的 PR 拿到的是只读 token，
# 即使工作流被 PR 里的提交改动，也拿不到发布凭据。

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: 单元测试 / 浏览器测试 / 原地更新测试
    uses: ./.github/workflows/tests.yml
